name: macOS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          configured_version="$(<VERSION)"
          if [[ "$tag_version" != "$configured_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($configured_version)." >&2
            exit 1
          fi

      - name: Build and verify unsigned DMG
        env:
          APP_BUILD_NUMBER: ${{ github.run_number }}
        run: ./build.sh dmg "${{ matrix.arch }}"

      - name: Upload architecture DMG
        uses: actions/upload-artifact@v6
        with:
          name: Mac-TaskManager-${{ matrix.arch }}
          path: dist/Mac-TaskManager-${{ github.ref_name }}-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download arm64 DMG
        uses: actions/download-artifact@v6
        with:
          name: Mac-TaskManager-arm64
          path: dist

      - name: Download x64 DMG
        uses: actions/download-artifact@v6
        with:
          name: Mac-TaskManager-x64
          path: dist

      - name: Publish only the two canonical DMGs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$VERSION"
          version="${tag#v}"
          arm64_dmg="dist/Mac-TaskManager-v${version}-arm64.dmg"
          x64_dmg="dist/Mac-TaskManager-v${version}-x64.dmg"
          test -s "$arm64_dmg"
          test -s "$x64_dmg"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$arm64_dmg" "$x64_dmg" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            while IFS= read -r asset; do
              case "$asset" in
                "Mac-TaskManager-v${version}-arm64.dmg"|"Mac-TaskManager-v${version}-x64.dmg")
                  continue
                  ;;
              esac
              gh release delete-asset "$tag" "$asset" \
                --repo "$GITHUB_REPOSITORY" \
                --yes
            done < <(
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
                --jq '.assets[].name | select(startswith("Mac-TaskManager") and endswith(".dmg"))'
            )
          else
            release_args=(
              --repo "$GITHUB_REPOSITORY"
              --target "$GITHUB_SHA"
              --title "Mac-TaskManager $version"
              --generate-notes
            )
            if [[ "$version" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$tag" "$arm64_dmg" "$x64_dmg" "${release_args[@]}"
          fi
