name: macOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build app and run checks
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check shell scripts
        run: bash -n build.sh scripts/*.sh

      - name: Build app and privileged helper
        run: |
          swift build -c release --product Mac-TaskManager
          swift build -c release --product MacFanHelper
          swift build -c release --product MacSystemHelper

      - name: Run cooling algorithm and authorization checks
        run: swift run -c release CoolModeAlgorithmChecks

      - name: Check process classification
        run: |
          swiftc Sources/MacTaskManager/ProcessClassification.swift Tests/MacTaskManagerTests/ProcessClassificationChecks.swift -o "$RUNNER_TEMP/ProcessClassificationChecks"
          "$RUNNER_TEMP/ProcessClassificationChecks"

      - name: Check process sorting and grouping
        run: |
          swiftc Sources/MacTaskManager/ProcessTableData.swift Tests/MacTaskManagerTests/ProcessTableChecks.swift -o "$RUNNER_TEMP/ProcessTableChecks"
          "$RUNNER_TEMP/ProcessTableChecks"

      - name: Check history and service management
        run: bash scripts/check-management-pages.sh
