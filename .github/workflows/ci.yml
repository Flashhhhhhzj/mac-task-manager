name: macOS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build app and run checks
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check shell scripts
        run: bash -n build.sh scripts/*.sh

      - name: Build app and privileged helper
        run: |
          swift build -c release --product Mac-TaskManager
          swift build -c release --product MacFanHelper

      - name: Run cooling algorithm and authorization checks
        run: swift run -c release CoolModeAlgorithmChecks
